<script>
(() => {
  'use strict';
  const $ = (q, root=document) => root.querySelector(q);
  const $$ = (q, root=document) => [...root.querySelectorAll(q)];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state = {page:'overview',data:null,authOptions:null,chat:[],chatModel:'',abort:null,modelUploadXhr:null,availableUpdate:null,activeAssistantNode:null,liveRenderFrame:0,workbenchObjectURL:null,startedAt:Date.now(),cookbookModels:null,cookbookSource:'',cookbookError:'',cookbookLoading:false,cookbookQuery:'',cookbookTask:'',cookbookMode:'huggingface',cookbookFormat:'gguf',cookbookSort:'downloads',cookbookNextCursor:null,cookbookAbort:null,cookbookRequestId:0,cookbookDebounce:0,modelSearch:'',connectionStatus:'connecting',errorStatus:0,errorCode:'',theme:localStorage.getItem('cortex-theme')||'dark'};
  let modalReturnFocus=null;
  const titles = {overview:['Overview','Your local inference runtime at a glance'],models:['Models','Configure local runtimes, weights, and task capabilities'],chat:['Chat playground','Stream responses from your hosted models'],settings:['Settings','Tune local hosting, API access, and saved configuration'],activity:['Activity','Inspect local inference requests, latency, and response codes'],api:['API & tools','Connect clients to your hosted models'],cookbook:['Model cookbook','Search the public Hugging Face model registry or offline catalog'],docs:['Docs','Practical guidance for setting up and operating Cortex LLMHoster']};
  document.documentElement.dataset.theme=state.theme;
  const apiKey = () => localStorage.getItem('cortex-api-key') || '';
  function toast(message,type='success') { const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),3600); }
  async function api(path, options={}) {
    const headers = new Headers(options.headers || {}); const key=apiKey(); if(key) headers.set('Authorization',`Bearer ${key}`);
    if(options.body && typeof options.body!=='string' && !(options.body instanceof FormData)){headers.set('Content-Type','application/json');options.body=JSON.stringify(options.body);}
    const response=await fetch(path,{...options,headers,credentials:'same-origin'});
    const type=response.headers.get('content-type')||'';let data=type.includes('json')?await response.json():await response.text();
    if(response.status===401){loginModal();const error=new Error('Sign-in is required.');error.status=401;error.code=data?.error?.code;throw error;}
    if(!response.ok){const error=new Error(data?.error?.message||data?.detail||data||`Request failed (${response.status})`);error.code=data?.error?.code;error.status=response.status;throw error;}
    return data;
  }
  function setTheme(theme){state.theme=theme;document.documentElement.dataset.theme=theme;localStorage.setItem('cortex-theme',theme);}
  function rememberModalFocus(){if(!$('#modal-root .modal-backdrop'))modalReturnFocus=document.activeElement;}
  function closeModal(){const root=$('#modal-root');if(!root?.firstElementChild)return;state.modelUploadXhr?.abort();state.modelUploadXhr=null;root.replaceChildren();const target=modalReturnFocus;modalReturnFocus=null;if(target?.isConnected)target.focus();}
  function setupModal(initialFocus){const root=$('#modal-root'),backdrop=$('.modal-backdrop',root);backdrop?.addEventListener('click',event=>{if(event.target===backdrop)closeModal();});$$('[data-close]',root).forEach(button=>button.addEventListener('click',closeModal));const target=initialFocus?$(initialFocus,root):$('[role="dialog"]',root);target?.focus();}
  function keepModalFocus(event){if(event.key!=='Tab')return;const dialog=$('#modal-root [role="dialog"]');if(!dialog)return;const focusable=$$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dialog).filter(element=>element.offsetParent!==null);if(!focusable.length){event.preventDefault();dialog.focus();return;}const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}}
  function loginModal(message='Sign in to the local Cortex LLMHoster server.') {
    rememberModalFocus();
    const options=state.authOptions||{account_login_enabled:false,api_key_login_enabled:true};
    let loginMode=options.account_login_enabled?'account':'api-key';
    const canToggle=options.account_login_enabled&&options.api_key_login_enabled;
    const loginHint=options.account_login_enabled
      ? (options.api_key_login_enabled?'Use the configured local account, or switch to API-key sign-in.':'Use the configured local account; authentication also requires a configured API key.')
      : 'Enter the configured CORTEX_API_KEY exactly, without quotes or the Bearer prefix.';
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="modal-head"><h2 id="dialog-title">Sign in to Cortex LLMHoster</h2><button type="button" class="icon-btn" data-close aria-label="Close">×</button></div><form id="login-form" class="modal-body"><p class="small-text">${esc(message)} ${esc(loginHint)} Successful sign-in creates a signed, HttpOnly session cookie for 30 days. Credentials are not stored in the browser.</p><div id="account-login-fields" class="field-grid"><div class="field"><label for="login-username">Local admin username</label><input id="login-username" class="input" type="text" autocomplete="username" placeholder="Username"></div><div class="field"><label for="login-password">Password</label><input id="login-password" class="input" type="password" autocomplete="current-password" placeholder="Account password"></div></div><div id="api-key-login-fields" class="field" hidden><label for="login-key">Local CORTEX_API_KEY</label><input id="login-key" class="input" type="password" autocomplete="off" placeholder="Local API key"></div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" id="login-mode-toggle" class="btn">Use API key instead</button><button type="submit" class="btn primary">Sign in</button></div></form></div></div>`;
    setupModal(loginMode==='account'?'#login-username':'#login-key');
    const setLoginMode=mode=>{loginMode=mode;const account=mode==='account';$('#account-login-fields').hidden=!account;$('#api-key-login-fields').hidden=account;$('#login-username').required=account;$('#login-password').required=account;$('#login-key').required=!account;$('#login-mode-toggle').hidden=!canToggle;$('#login-mode-toggle').textContent=account?'Use API key instead':'Use account login';$(account?'#login-username':'#login-key').focus();};
    setLoginMode(loginMode);
    $('#login-mode-toggle').onclick=()=>setLoginMode(loginMode==='account'?'api-key':'account');
    $('#login-form').onsubmit=async e=>{e.preventDefault();const credentials=loginMode==='account'?{username:$('#login-username').value.trim(),password:$('#login-password').value}:{api_key:$('#login-key').value.trim()};try{const response=await fetch('/admin/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentials)});let data={};try{data=await response.json();}catch{}if(!response.ok)throw new Error(data.error?.message||`Login failed (${response.status})`);localStorage.removeItem('cortex-api-key');closeModal();await refresh();}catch(error){toast(error.message,'error');}};
  }
  async function logout(){try{await fetch('/admin/api/auth/logout',{method:'POST',credentials:'same-origin'});}catch{}localStorage.removeItem('cortex-api-key');state.data=null;state.error='';state.errorStatus=401;state.errorCode='invalid_api_key';state.connectionStatus='auth-required';$('#health-pill').innerHTML='<i class="dot off"></i>Sign-in required';render();toast('Dashboard session ended.');}
  function modelIdOptions(selected='') { const models=state.data?.models||[];return models.map(m=>`<option value="${esc(m.id)}" ${m.id===selected?'selected':''}>${esc(m.id)}${m.default?' · default':''}</option>`).join(''); }
  function requireState(){if(state.data?.server)return null;const authRequired=state.errorStatus===401||state.connectionStatus==='auth-required';const setupRequired=state.errorCode==='admin_auth_not_configured';const heading=authRequired?'Sign in to continue':setupRequired?'Server authentication needs setup':state.errorStatus?`Cortex returned HTTP ${state.errorStatus}`:'Cortex server not reachable';const detail=authRequired?'Use the configured local admin account or API key.':setupRequired?(state.error||'Authentication is enabled but no local API key is configured.'):state.errorStatus?(state.error||'The server returned an error.'):`${state.error||'No response was received.'} Check that Cortex is running and reachable, then retry.`;const action=authRequired?'Sign in':setupRequired?'Open docs':'Try again';return `<div class="info-banner warning" role="alert"><strong>${esc(heading)}.</strong> ${esc(detail)} <button class="btn small" id="connection-action" type="button">${action}</button></div>`;}
  function render(){
    const content=$('#content');const [title,subtitle]=titles[state.page];$('#page-title').textContent=title;$('#page-subtitle').textContent=subtitle;
    $$('#nav button').forEach(b=>{const current=b.dataset.page===state.page;b.classList.toggle('active',current);if(current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    $('#model-count').textContent=state.data?.models?.length??'0';$('#version').textContent=`Cortex LLMHoster · ${state.data?.version||'Local model hoster'}`;const authButton=$('#auth-btn'),authEnabled=state.data?.server?.api_auth_enabled;authButton.textContent=state.data?(authEnabled?'Log out':'Auth off'):state.connectionStatus==='auth-required'?'Sign in':'Retry';authButton.title=state.data?(authEnabled?'End this dashboard session':'API authentication is disabled'):state.connectionStatus==='auth-required'?'Sign in with a local account or API key':'Retry the connection to the Cortex server';
    const gate=requireState();
    if(gate&&state.page!=='docs'){
      const authRequired=state.errorStatus===401||state.connectionStatus==='auth-required';
      const setupRequired=state.errorCode==='admin_auth_not_configured';
      const loginHelp=authRequired||setupRequired?`<div class="card card-body"><h2 style="font-size:14px">Quick start</h2><p class="small-text">Authentication-enabled mode requires a local API key. Add an admin account for cookie-based dashboard sign-in, or disable authentication for keyless local access.</p><div class="code">export CORTEX_API_KEY='a-long-random-secret'
# Optional account-based dashboard sign-in:
# export CORTEX_ADMIN_USERNAME='admin'
# export CORTEX_ADMIN_PASSWORD='a-long-unique-password'
python -m cortex_llmhoster
# No-auth mode (use instead of setting CORTEX_API_KEY):
python -m cortex_llmhoster --no-auth</div></div>`:'';
      content.innerHTML=`<div class="page-head"><div><div class="eyebrow">Connection status</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div></div>${gate}${loginHelp}`;
      $('#connection-action')?.addEventListener('click',()=>authRequired?loginModal():setupRequired?navigate('docs'):bootstrap());
      return;
    }
    if(state.page==='overview')content.innerHTML=overviewPage();
    else if(state.page==='models')content.innerHTML=modelsPage();
    else if(state.page==='chat')content.innerHTML=chatPage();
    else if(state.page==='settings')content.innerHTML=settingsPage();
    else if(state.page==='activity')content.innerHTML=activityPage();
    else if(state.page==='api')content.innerHTML=apiPage();
    else if(state.page==='docs')content.innerHTML=docsPage();
    else content.innerHTML=cookbookPage();
    attachPageActions();
  }
  function overviewPage(){const s=state.data.server,m=state.data.metrics,models=state.data.models||[],hw=state.data.runtime.hardware,runtime=state.data.runtime.models||{},running=models.filter(x=>runtime[x.id]?.status==='running').length,capabilities=[...new Set(models.flatMap(x=>x.capabilities||[]))];return `<div class="page-head"><div><div class="eyebrow">Local inference · ${new Date().toLocaleTimeString()}</div><h1>Cortex local hoster</h1><p>Host text and multimodal models through per-model local runtimes and one OpenAI-compatible API.</p></div><div class="row"><button class="btn" data-action="refresh">↻ Refresh</button><button class="btn primary" data-page-link="models">＋ Manage models</button></div></div>${state.data.env_overrides?.length?`<div class="info-banner"><strong>Environment overrides active.</strong> ${esc(state.data.env_overrides.join(', '))}. These values take precedence over saved UI configuration.</div>`:''}<div class="grid stats"><div class="card stat-card"><div class="stat-label">Local models</div><div class="stat-value">${models.length}</div><div class="stat-foot">${running} currently loaded · weights stay on this machine</div></div><div class="card stat-card"><div class="stat-label">Inference requests</div><div class="stat-value">${fmt(m.total_requests)}</div><div class="stat-foot">${m.in_flight} in flight · ${m.failed_requests} failed</div></div><div class="card stat-card"><div class="stat-label">Average response duration</div><div class="stat-value">${Number(m.average_latency_ms||0).toFixed(1)}<span style="font-size:13px;color:var(--muted)"> ms</span></div><div class="stat-foot">Measured across full response streams</div></div><div class="card stat-card"><div class="stat-label">Cortex uptime</div><div class="stat-value">${duration(m.uptime_seconds)}</div><div class="stat-foot">${esc(s.host)}:${s.port} · ${s.workers} worker</div></div></div><div class="grid columns"><div class="card"><div class="card-head"><h2>Hosted models</h2><button class="btn small" data-page-link="models">Manage →</button></div><div class="card-body">${models.length?models.slice(0,6).map(modelRow).join(''):`<div class="empty"><div class="big">⬡</div>No model configured.<br><button class="btn small primary" style="margin-top:12px" data-page-link="models">Add a local model</button></div>`}</div></div><div class="grid"><div class="card"><div class="card-head"><h2>Hardware snapshot</h2></div><div class="card-body small-text" style="line-height:1.9"><div class="row space"><span>CPU</span><strong>${hw.cpu_count} logical cores</strong></div><div class="row space"><span>Suggested threads</span><strong>${hw.recommended_threads}</strong></div><div class="row space"><span>RAM</span><strong>${hw.ram_total_gb===null?'—':`${hw.ram_total_gb} GiB`}</strong></div><div style="margin-top:7px"><span class="muted">GPU</span><div style="overflow-wrap:anywhere">${esc(hw.gpu)}</div></div></div></div><div class="card"><div class="card-head"><h2>Host API</h2><span class="tag ${models.length?'good':''}">${models.length?'LOCAL':'READY'}</span></div><div class="card-body small-text" style="line-height:1.9"><div class="row space"><span>Default model</span><strong>${esc(s.default_model||'—')}</strong></div><div class="row space"><span>Serving runtime(s)</span><strong>${[...new Set(models.map(x=>x.runtime))].map(esc).join(', ')||'—'}</strong></div><div class="row space"><span>Task types</span><strong>${capabilities.length}</strong></div><div class="row space"><span>API authentication</span><strong>${s.api_auth_enabled?'Enabled':'Disabled'}</strong></div><div class="row space"><span>Build</span><strong>${esc(state.data.version)}</strong></div></div></div></div></div>`;}
  const optimizationModeNames={
    low_minus:'Low− · quality / speed',
    low_plus:'Low+ · quality first',
    balanced:'Balanced (Auto)',
    medium_minus:'Medium−',
    medium_plus:'Medium+',
    high_minus:'High− · memory efficient',
    high_plus:'High+ · most memory efficient',
    ultra:'ULTRA (optional)'
  };
  function optimizationPreset(model){
    if(optimizationModeNames[model.optimization_preset])return model.optimization_preset;
    if(Number(model.optimization_level)===1)return 'ultra';
    if(Number(model.optimization_level)===-1)return 'high_plus';
    return 'balanced';
  }
  function optimizationPresetLabel(model){return optimizationModeNames[optimizationPreset(model)]||'Balanced (Auto)';}
  function modelRow(m){const runtime=state.data.runtime?.models?.[m.id],status=runtime?.status||'stopped',capabilities=(m.capabilities||[]).slice(0,3).join(' · ')||'No tasks declared';return `<div class="model-row"><div class="model-avatar">${esc((m.id||'M').slice(0,1).toUpperCase())}</div><div class="model-main"><div class="model-name">${esc(m.id)} ${m.default?'<span class="tag accent">DEFAULT</span>':''}</div><div class="model-url">${esc(m.runtime)} · ${esc(capabilities)}</div></div><span class="tag ${status==='running'?'good':status==='error'?'warn':''}">${esc(status.toUpperCase())}</span></div>`;}
  function docsPage(){return `<div class="page-head"><div><div class="eyebrow">Operator handbook</div><h1>Cortex LLMHoster Docs</h1><p>A practical guide to installing, securing, configuring, and using your local model host.</p></div><div class="row"><button class="btn primary" data-page-link="models">＋ Configure a model</button></div></div>
    <div class="info-banner"><strong>Local inference by design.</strong> Model weights and prompts are served by local runtimes. Cortex does not download model weights for you or require a cloud inference provider. Choosing a public model in the cookbook is a reference; download it yourself and follow its license and usage terms.</div>
    <div class="grid columns">
      <div class="card"><div class="card-head"><h2>1 · Install and launch</h2><span class="tag accent">Python 3.11+</span></div><div class="card-body"><p class="small-text" style="line-height:1.7">From the project root, create an isolated environment, install Cortex LLMHoster, then run it. Keep the first run on a trusted local interface.</p><pre class="code">python -m venv .venv
# Linux / macOS
. .venv/bin/activate
# Windows PowerShell: .\\.venv\\Scripts\\Activate.ps1
python -m pip install -e .
python -m cortex_llmhoster --host 127.0.0.1 --port 8000 --workers 1</pre><p class="small-text" style="line-height:1.7;margin-top:12px">To choose a specific Python executable, copy <code>.env.example</code> to <code>.env</code> and set its path (the file is local and Git-ignored):</p><pre class="code"># .env in the project root
2PY2=/absolute/path/to/python3.12</pre><p class="small-text" style="line-height:1.7;margin:10px 0 0">Alternatively, put one executable path in the root-level <code>python.env</code>, or set <code>2PY2</code> in the process environment. Precedence: process variable, <code>.env</code>, <code>python.env</code>, then the Python that launched Cortex. On Windows, use a path such as <code>C:\\Python312\\python.exe</code>.</p></div></div>
      <div class="card"><div class="card-head"><h2>2 · Choose your access mode</h2><span class="tag good">Local-first</span></div><div class="card-body"><p class="small-text" style="line-height:1.7">Authentication is enabled by default. Set a long, random local <code>CORTEX_API_KEY</code> before starting. The dashboard can sign in with the configured local admin username/password; successful sign-in uses a signed, HttpOnly session cookie. API clients continue to use a bearer key.</p><pre class="code">CORTEX_API_KEY=replace-with-a-long-random-key
CORTEX_ADMIN_USERNAME=admin
CORTEX_ADMIN_PASSWORD=replace-with-a-unique-password</pre><p class="small-text" style="line-height:1.7;margin-top:12px">For a trusted, isolated machine only, disable authentication with <code>CORTEX_API_AUTH_ENABLED=false</code> or <code>--no-auth</code>. No API key or dashboard login is then required. Do not expose an unauthenticated listener to a LAN or the public internet; if you bind to <code>0.0.0.0</code>, apply network access controls.</p></div></div>
      <div class="card"><div class="card-head"><h2>3 · Add a local model</h2><span class="tag">Models</span></div><div class="card-body"><ol class="small-text" style="line-height:1.9;padding-left:19px;margin:0"><li>Open <strong>Models → Add a model</strong>.</li><li>For llama.cpp, click <strong>Browse this device</strong> and choose a <code>.gguf</code> in File Explorer or your system file picker. Cortex streams it to its local models folder (<code>CORTEX_MODELS_DIR</code> when configured, otherwise <code>~/models</code>) and shows upload progress; large files need enough free disk space. If the model is already on the host, expand <strong>Use a GGUF already on this Cortex server</strong> to select it without copying. That picker scans configured <code>CORTEX_MODELS_DIR</code> roots, project/home <code>models</code> folders, the Hugging Face cache, and folders beside configured model paths.</li><li>If the model is already available at another server-side location, turn on <strong>Enter a model path manually</strong> and enter its absolute path. A browser file chooser cannot reveal a local path to the server, so newly selected files are copied to the Cortex host. Cortex does not download models.</li><li>Choose a model name, optimization mode, and default status; optionally check setup, then Save and Start.</li></ol><p class="small-text" style="line-height:1.7;margin:12px 0 0">For Python-free GGUF inference without an external <code>llama-server</code>, choose <strong>Cortex native C++ GGUF backend</strong> and build the native host in <code>native/</code> (or set <code>CORTEX_CPP_HOST</code>). The older Python-binding runtime remains only for existing configurations. For other local servers, choose <strong>Custom local server</strong> and select an optional vLLM, SGLang, TGI, or MLX-LM command template, then review the argument list under Advanced settings. Templates only prefill commands; see <code>SERVER_OPTIONS.md</code> for server choices and use cases. It must run on this machine and provide a compatible local API. Use the provided <code>{python}</code>, <code>{model_path}</code>, <code>{host}</code>, and <code>{port}</code> placeholders where appropriate; commands are passed as arguments, not through a shell.</p></div></div>
      <div class="card"><div class="card-head"><h2>4 · Set supported tasks</h2><span class="tag">Suggestions, not guarantees</span></div><div class="card-body"><p class="small-text" style="line-height:1.7">When you select a discovered model file, Cortex reads its filename and a small GGUF metadata prefix to suggest task checkboxes. This is best-effort: names and metadata are inconsistent. Review the checks, use <strong>Auto-detect tasks</strong> again if needed, and edit them manually. A task declaration describes what the model/runtime can do; it does not add a capability or install a backend.</p><p class="small-text" style="line-height:1.7;margin-bottom:0">The preserved Hugging Face cookbook helps you find model cards and task labels. Verify model requirements, runtime support, and license terms before downloading or deploying a model.</p></div></div>
      <div class="card"><div class="card-head"><h2>5 · Tune quality, speed, and memory</h2><span class="tag accent">Per model</span></div><div class="card-body"><p class="small-text" style="line-height:1.7">Start with <strong>Balanced (Auto)</strong>. Among the standard modes, Low−, Low+, and Medium− generally prioritize quality and prompt-processing speed at greater memory cost; Medium+, High−, and High+ use increasingly memory-conscious settings, which may affect output quality or throughput. Effects depend on your model, llama.cpp build, and hardware—there are no universal speed guarantees.</p><p class="small-text" style="line-height:1.7;margin-bottom:0"><strong>ULTRA is optional and experimental.</strong> It may increase batch sizes or enable runtime tuning that needs extra memory. If loading fails, stop the model, switch to a less demanding mode, and check the runtime output under the model card's More details.</p></div></div>
      <div class="card"><div class="card-head"><h2>6 · Operate the host</h2><span class="tag">Dashboard</span></div><div class="card-body"><ul class="small-text" style="line-height:1.9;padding-left:19px;margin:0"><li><strong>Models:</strong> Start, stop, restart, check setup, select the default, and review local runtime output. Stop all unloads managed local model processes.</li><li><strong>Chat playground:</strong> Test prompts and generation settings. Conversations are kept in this browser; export them before clearing or changing browsers.</li><li><strong>Settings:</strong> Configure listener, timeouts, request limits, authentication, and secret-free config import/export. Environment overrides take precedence over the saved dashboard configuration.</li><li><strong>Activity:</strong> View in-memory per-worker counters. Metrics reset when the server restarts and are not benchmark claims.</li><li><strong>Model cookbook:</strong> Browse the curated offline catalog or search public Hugging Face metadata; a network failure does not prevent using the offline catalog.</li></ul><p class="small-text" style="line-height:1.7;margin:12px 0 0">For managed local models, keep <code>workers=1</code> to avoid duplicate model loads. The configured host, port, and worker count are passed to Uvicorn. Increase a model's runtime parallelism separately when the backend supports it.</p></div></div>
      <div class="card"><div class="card-head"><h2>7 · Connect an API client</h2><span class="tag good">OpenAI-compatible</span></div><div class="card-body"><p class="small-text" style="line-height:1.7">Use the server origin as the base URL, <code>/v1</code> as the API base path, a configured model ID, and your local bearer key when authentication is enabled.</p><pre class="code">curl http://127.0.0.1:8000/v1/chat/completions \\
  -H 'Authorization: Bearer YOUR_CORTEX_API_KEY' \\
  -H 'Content-Type: application/json' \\
  -d '{"model":"your-model","messages":[{"role":"user","content":"Hello"}],"stream":true}'</pre><p class="small-text" style="line-height:1.7;margin:12px 0 0">Use <code>GET /v1/models</code> to see public model IDs, <code>/health</code> for liveness, and <code>/ready</code> for readiness. In the dashboard's API &amp; tools tab, the local workbench lets you try endpoint paths and supported media requests against the selected local runtime.</p></div></div>
      <div class="card"><div class="card-head"><h2>8 · Back up and update safely</h2><span class="tag warn">Review first</span></div><div class="card-body"><p class="small-text" style="line-height:1.7">Export the dashboard's secret-free JSON config and back up your local configuration/data files before an update. Keep credentials in environment variables or an ignored <code>.env</code>; do not include secrets in exported files. Updates are manual: review the source/version and use the updater from the session's designated branch, then restart Cortex. Do not update a multi-worker local-model host in place.</p><p class="small-text" style="line-height:1.7;margin-bottom:0">If setup or inference fails, check the model's runtime output, confirm its file and executable paths, verify the selected tasks/runtime, then consult the repository's <code>INSTALLTION.md</code> and <code>TROUBLESHOOTING.md</code>.</p></div></div>
    </div><div class="card" style="margin-top:16px"><div class="card-head"><h2>Useful dashboard shortcuts</h2></div><div class="card-body small-text" style="line-height:1.9">Use <span class="kbd">Alt</span> + <span class="kbd">1–8</span> to open Overview, Models, Chat, Settings, Activity, API &amp; tools, Model cookbook, and Docs. Press <span class="kbd">Esc</span> to close a dialog or mobile navigation.</div></div>`;}
  function modelsPage(){
    const models=state.data.models||[],runtimeModels=state.data.runtime?.models||{};
    if(!models.length)state.modelSearch='';
    const activeCount=models.filter(model=>['starting','running','stopping'].includes(runtimeModels[model.id]?.status)).length;
    const defaultLocked=(state.data.env_overrides||[]).includes('default_model');
    return `<div class="page-head"><div><div class="eyebrow">Your local models</div><h1>Models</h1><p>For a GGUF model, add its local file, choose a mode, then press Start. Advanced settings are optional.</p></div><div class="row model-page-actions">${activeCount?`<button class="btn" data-action="stop-all-models" title="Unload every running local model to release its process memory">Stop all (${activeCount})</button>`:''}<button class="btn primary" data-action="add-model">＋ Add a model</button></div></div>
      <div class="model-guide"><strong>Quick setup</strong><span>1. Add your local model file</span><span>2. Choose a mode (GGUF)</span><span>3. Press Start</span><span class="muted">Your default model starts with Cortex.</span></div>
      ${models.length?`<div class="model-search-row"><div class="field"><label for="model-search">Search models</label><input class="input" id="model-search" type="search" value="${esc(state.modelSearch)}" placeholder="Name, file path, task, mode…"></div><span class="small-text" id="model-search-count"></span></div><div id="model-search-empty" class="card empty" hidden>No models match your search.</div><div class="grid model-grid">${models.map(m=>{
        const runtime=runtimeModels[m.id]||{status:'stopped'},status=runtime.status||'stopped',llama=m.runtime==='llama.cpp',cortex=m.runtime==='cortex',cortexCpp=m.runtime==='cortex-cpp';
        const tasks=(m.capabilities||[]).slice(0,4).map(task=>`<span class="tag">${esc(task.replaceAll('_',' '))}</span>`).join(' ')||'<span class="muted">No tasks selected</span>';
        const path=m.model_path||'Path supplied by the local runtime';
        const searchText=[m.id,m.runtime,path,status,optimizationPresetLabel(m),...(m.capabilities||[])].join(' ').toLowerCase();
        return `<article class="card model-card simple-model-card" data-search="${esc(searchText)}">
          <div class="model-card-top"><div class="model-avatar">${esc((m.id||'M').slice(0,1).toUpperCase())}</div><div class="model-main"><div class="model-name">${esc(m.id)} ${m.default?'<span class="tag accent">DEFAULT</span>':''}</div><div class="model-url" title="${esc(path)}">${esc(path)}</div></div><span class="tag ${status==='running'?'good':status==='error'?'warn':''}">${esc(status.toUpperCase())}</span></div>
          <div class="simple-model-summary"><span>${cortexCpp?(m.model_path&&!String(m.model_path).toLowerCase().endsWith('.gguf')?'Source → cached GGUF · Cortex native C++':'GGUF · Cortex native C++'):cortex?'GGUF · Cortex Python legacy':llama?'GGUF · llama.cpp server':'Local server'}</span>${llama?`<span>${esc(optimizationPresetLabel(m))}</span>`:''}</div>
          ${runtime.error?`<div class="info-banner warning model-error"><strong>Needs attention:</strong> ${esc(runtime.error)}</div>`:''}
          <div class="model-footer"><button class="btn primary" data-action="${status==='running'||status==='starting'?'stop-model':'start-model'}" data-id="${esc(m.id)}">${status==='running'||status==='starting'?'Stop model':'Start model'}</button><button class="btn" data-action="edit-model" data-id="${esc(m.id)}">Edit</button>${m.default?'':`<button class="btn" data-action="set-default-model" data-id="${esc(m.id)}" ${defaultLocked?'disabled title="Default model is set by an environment variable"':''}>Make default</button>`}</div>
          <details class="model-more"><summary>More details and actions</summary><div class="model-more-body"><div><div class="meta-label">Tasks</div><div class="meta-value">${tasks}</div></div><div><div class="meta-label">Runtime</div><div class="meta-value">${esc(m.runtime)}${runtime.port?` · local port ${runtime.port}`:''}${runtime.uptime_seconds?` · running ${duration(runtime.uptime_seconds)}`:''}</div></div>${llama?`<div><div class="meta-label">Device</div><div class="meta-value">${m.gpu_layers===0?'CPU only':m.gpu_layers===-1?'Use available GPU layers':`${m.gpu_layers} GPU layers`}</div></div>`:''}<div class="row model-more-actions"><button class="btn small" data-action="test-model" data-id="${esc(m.id)}">Check setup</button>${status==='running'?`<button class="btn small" data-action="restart-model" data-id="${esc(m.id)}">Restart</button>`:''}<button class="btn small danger" data-action="delete-model" data-id="${esc(m.id)}">Remove</button></div>${runtime.logs?.length?`<details><summary class="small-text">Runtime output</summary><pre class="code" style="max-height:160px;overflow:auto;white-space:pre-wrap">${esc(runtime.logs.join('\n'))}</pre></details>`:''}</div></details>
        </article>`;
      }).join('')}</div>`:`<div class="card empty"><div class="big">⬡</div><strong>No models yet</strong><p>Add a local GGUF model, choose a mode, and start it here. Custom local servers are configured under Advanced settings.</p><button class="btn primary" data-action="add-model">＋ Add your first model</button></div>`}`;
  }
  function chatPage(){const models=state.data.models||[],selectedModel=models.find(x=>x.id===(state.chatModel||state.data.server.default_model||models[0]?.id)),runtimeState=selectedModel?state.data.runtime.models[selectedModel.id]:null;return `<div class="page-head"><div><div class="eyebrow">Interactive inference</div><h1>Chat playground</h1><p>Stream tokens, tune generation parameters, and keep sessions in this browser.</p></div><div class="row"><button class="btn" data-action="export-chat">⇩ Export</button><button class="btn" data-action="clear-chat">⌫ Clear</button></div></div>${!models.length?`<div class="info-banner warning"><strong>No models configured.</strong> Add a local model before starting a chat.</div>`:''}${selectedModel&&runtimeState?.status!=='running'?`<div class="info-banner warning"><strong>This local model is not loaded.</strong> Open Models and press Start${runtimeState?.error?`: ${esc(runtimeState.error)}`:'.'} The default model loads automatically when Cortex starts.</div>`:''}
      <div class="chat-layout"><div class="card chat-panel"><div class="chat-toolbar"><span class="tag accent">MODEL</span><select id="chat-model" class="select" ${models.length?'':'disabled'}>${modelIdOptions(state.chatModel||state.data.server.default_model||models[0]?.id)}</select><span class="spacer"></span><span class="small-text" id="chat-state">Ready</span><button class="btn small" data-action="cancel-chat" id="cancel-chat" hidden>Stop</button></div><div class="chat-messages" id="chat-messages"></div><div class="chat-composer"><div class="composer-box"><textarea id="composer" placeholder="Message the model…  (Enter to send, Shift+Enter for a new line)" ${models.length?'':'disabled'}></textarea><div class="composer-bottom"><span class="composer-hint" id="prompt-hint">0 chars · context stays in this browser</span><button class="btn primary small" data-action="send-chat" id="send-chat" ${models.length?'':'disabled'}>Send ↗</button></div></div></div></div><aside class="card chat-options"><h3>Generation settings</h3><div class="field full"><label>System prompt</label><textarea class="textarea" id="system-prompt" placeholder="You are a helpful assistant…">${esc(localStorage.getItem('cortex-system-prompt')||'')}</textarea></div><div class="field"><div class="range-head"><label for="temperature">Temperature</label><span id="temp-value">0.7</span></div><input type="range" min="0" max="2" step="0.1" value="0.7" id="temperature"></div><div class="field"><label for="max-tokens">Max output tokens</label><input class="input" type="number" id="max-tokens" min="1" max="131072" value="1024"></div><div class="field"><div class="range-head"><label for="top-p">Top P</label><span id="top-p-value">1.0</span></div><input type="range" min="0.05" max="1" step="0.05" value="1" id="top-p"></div><div class="field"><label for="frequency-penalty">Frequency penalty</label><input class="input" type="number" id="frequency-penalty" min="-2" max="2" step="0.1" value="0"></div><div class="field"><label for="presence-penalty">Presence penalty</label><input class="input" type="number" id="presence-penalty" min="-2" max="2" step="0.1" value="0"></div><div class="field full"><label for="stop-sequence">Stop sequence <span class="muted">(optional)</span></label><input class="input" id="stop-sequence" placeholder="e.g. END"></div><label class="check-row field full"><input id="stream-toggle" type="checkbox" checked> Stream tokens as they arrive</label><div class="divider field full"></div><div class="small-text field full">Prompt estimate: <strong id="prompt-estimate">0 tokens</strong> · approximate only</div></aside></div>`;}
  function settingsPage(){const s=state.data.server,h=state.data.runtime.hardware,locks=state.data.env_overrides||[];const lock=(field)=>locks.includes(({host:'host',port:'port',workers:'workers',log_level:'log_level',access_log:'access_log',llama_server_path:'llama_server_path',api_auth_enabled:'api_auth_enabled',default_model:'default_model',max_json_body_bytes:'max_json_body_bytes',max_media_body_bytes:'max_media_body_bytes',max_inference_requests:'max_inference_requests',connect_timeout:'connect_timeout',read_timeout:'read_timeout',write_timeout:'write_timeout',pool_timeout:'pool_timeout',max_connections:'max_connections',max_keepalive_connections:'max_keepalive_connections',keepalive_expiry:'keepalive_expiry'})[field]);const field=(name,label,value,type='number',hint='')=>`<div class="field"><label for="cfg-${name}">${label}${lock(name)?' <span class="tag warn">ENV</span>':''}</label><input class="input" id="cfg-${name}" type="${type}" value="${esc(value??'')}" ${lock(name)?'disabled':''}>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
    return `<div class="page-head"><div><div class="eyebrow">Host configuration</div><h1>Settings</h1><p>Tune the local inference runtime for your CPU, available RAM, and GPU. Model changes apply without restarting Cortex.</p></div><div class="row"><button class="btn" data-action="reload-config">↻ Reload</button><button class="btn primary" data-action="save-settings">Save settings</button></div></div>${locks.length?`<div class="info-banner"><strong>Environment-managed fields are locked.</strong> ${esc(locks.join(', '))} are controlled by environment variables and take precedence over this form.</div>`:''}<div class="settings-layout"><div class="card settings-card"><h2>Hardware detected</h2><p>Best-effort host snapshot. GPU offload depends on the installed llama.cpp build.</p><div class="field-grid"><div class="field"><label>CPU</label><div class="meta-value">${h.cpu_count} logical cores · ${h.recommended_threads} suggested threads</div></div><div class="field"><label>Memory</label><div class="meta-value">${h.ram_total_gb===null?'Not detected':`${h.ram_total_gb} GiB total · ${h.ram_available_gb} GiB available`}</div></div><div class="field full"><label>GPU</label><div class="meta-value">${esc(h.gpu)}</div></div><div class="field full"><label>Platform</label><div class="meta-value">${esc(h.platform)}</div></div></div></div><div class="card settings-card"><h2>llama.cpp runtime</h2><p>Install a CPU-only or hardware-accelerated llama.cpp build. Models run as managed local processes.</p><div class="field-grid">${field('llama_server_path','llama-server executable',s.llama_server_path||'','text','Optional. Leave empty to resolve llama-server from PATH. Changes restart managed local model processes.')}</div></div><div class="card settings-card"><h2>Listener & serving API</h2><p>Cortex serves an OpenAI-compatible API for the locally hosted models.</p><div class="field-grid">${field('host','Listen host',s.host,'text','Use 0.0.0.0 in containers; restrict access with a firewall on public networks.')}${field('port','Listen port',s.port)}${field('workers','Cortex worker processes',s.workers,'number','Use one worker with local models to avoid loading model weights multiple times. Set model parallelism in its runtime settings.') }<div class="field"><label for="cfg-default_model">Default model ${lock('default_model')?'<span class="tag warn">ENV</span>':''}</label><select class="select" id="cfg-default_model" ${lock('default_model')?'disabled':''}><option value="">No default</option>${modelIdOptions(s.default_model)}</select></div><div class="field"><label for="cfg-log_level">Server log level ${lock('log_level')?'<span class="tag warn">ENV</span>':''}</label><select class="select" id="cfg-log_level" ${lock('log_level')?'disabled':''}>${['critical','error','warning','info','debug','trace'].map(level=>`<option value="${level}" ${s.log_level===level?'selected':''}>${level}</option>`).join('')}</select></div><label class="check-row field full"><input id="cfg-access_log" type="checkbox" ${s.access_log?'checked':''} ${lock('access_log')?'disabled':''}> Enable request access logs ${lock('access_log')?'<span class="tag warn">ENV</span>':''}</label></div></div><div class="card settings-card"><h2>Request limits & authentication</h2><p>Bound JSON prompts and media uploads. Multipart files spool to temporary storage before being relayed locally.</p><div class="field-grid">${field('max_json_body_bytes','Max JSON body bytes',s.max_json_body_bytes)}${field('max_media_body_bytes','Max audio/image/video upload bytes',s.max_media_body_bytes,'number','Default 2 GiB per request; reduce this if temporary storage is limited.')}${field('max_inference_requests','Max concurrent inference requests',s.max_inference_requests,'number','Caps concurrently handled inference requests and streams. Excess requests receive HTTP 503; changes apply immediately.')}<div class="field full"><label class="check-row" for="cfg-api_auth_enabled"><input id="cfg-api_auth_enabled" type="checkbox" ${s.api_auth_enabled?'checked':''} ${lock('api_auth_enabled')?'disabled':''}> Require authenticated API access ${lock('api_auth_enabled')?'<span class="tag warn">ENV</span>':''}</label><div class="hint">When on, a non-empty ${esc(s.api_key_env||'CORTEX_API_KEY')} is required. Optional admin account credentials enable username/password cookie sign-in; API clients can use the bearer key. When off, no API key or login is required; dashboard and inference APIs accept anonymous requests. Use only on a trusted local network.</div></div></div></div><div class="card settings-card"><h2>Connections & timeouts</h2><p>These limits affect Cortex API handling, not the model's generation speed.</p><div class="field-grid">${field('max_connections','Max connections',s.max_connections)}${field('max_keepalive_connections','Keep-alive connections',s.max_keepalive_connections)}${field('keepalive_expiry','Keep-alive expiry (s)',s.keepalive_expiry)}${field('connect_timeout','Connect (s)',s.connect_timeout)}${field('read_timeout','Read (s)',s.read_timeout)}${field('write_timeout','Write (s)',s.write_timeout)}${field('pool_timeout','Pool wait (s)',s.pool_timeout)}</div></div><div class="card settings-card"><h2>Software updates</h2><p>Check the official Cortex branch on GitHub. The check sends only version/commit metadata; installing is manual and requires a restart. Model weights and your configuration are left unchanged.</p><div class="row" style="flex-wrap:wrap"><span class="tag accent">Installed v${esc(state.data.version)}</span><button class="btn" data-action="check-updates">↻ Check for updates</button><button class="btn primary" id="install-update-button" data-action="install-update" disabled hidden>Install update</button></div><div id="update-status" class="small-text" style="margin-top:10px">Updates are not installed automatically.</div></div><div class="card settings-card"><h2>Configuration backup</h2><p>Export/import a secret-free JSON snapshot. Credentials are referenced by environment variable names.</p><div class="row" style="flex-wrap:wrap"><button class="btn" data-action="export-config">⇩ Export JSON</button><label class="btn" for="config-import">⇧ Import JSON</label><input hidden id="config-import" type="file" accept="application/json,.json"><button class="btn" data-action="reset-config">Reset saved override</button></div><div class="small-text" style="margin-top:13px">Saved overlay: <code>${esc(state.data.admin_config_path)}</code>. Original TOML remains unchanged.</div></div></div>`;}

  function activityPage(){const m=state.data.metrics,codes=Object.entries(m.status_codes||{}).sort((a,b)=>a[0].localeCompare(b[0]));const max=Math.max(1,...codes.map(x=>x[1]));const byModel=Object.entries(m.requests_by_model||{}).sort((a,b)=>b[1]-a[1]);return `<div class="page-head"><div><div class="eyebrow">Serving telemetry</div><h1>Activity</h1><p>Lightweight counters are local to this worker and reset when it restarts.</p></div><div class="row"><button class="btn" data-action="refresh">↻ Refresh</button><button class="btn danger" data-action="reset-metrics">Reset counters</button></div></div><div class="grid stats"><div class="card stat-card"><div class="stat-label">Completed</div><div class="stat-value">${fmt(m.completed_requests)}</div><div class="stat-foot">Total requests: ${fmt(m.total_requests)}</div></div><div class="card stat-card"><div class="stat-label">In flight</div><div class="stat-value">${fmt(m.in_flight)}</div><div class="stat-foot">Active local inference requests</div></div><div class="card stat-card"><div class="stat-label">Avg response duration</div><div class="stat-value">${Number(m.average_latency_ms||0).toFixed(1)}<span class="small-text"> ms</span></div><div class="stat-foot">Measured through response stream</div></div><div class="card stat-card"><div class="stat-label">Inference errors</div><div class="stat-value">${fmt(m.failed_requests)}</div><div class="stat-foot">Model server and API failures</div></div></div><div class="grid activity-grid"><div class="card"><div class="card-head"><h2>Responses by status code</h2></div><div class="card-body">${codes.length?codes.map(([code,n])=>`<div class="bar-row"><span>${esc(code)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,n/max*100)}%"></div></div><span>${fmt(n)}</span></div>`).join(''):'<div class="empty">No completed requests yet.</div>'}</div></div><div class="card"><div class="card-head"><h2>Requests by model</h2></div><div class="card-body">${byModel.length?byModel.map(([id,n])=>`<div class="bar-row" style="grid-template-columns:minmax(70px,1fr) 2fr 35px"><span title="${esc(id)}" style="overflow:hidden;text-overflow:ellipsis">${esc(id)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,n/Math.max(1,...byModel.map(x=>x[1]))*100)}%"></div></div><span>${fmt(n)}</span></div>`).join(''):'<div class="empty">No model requests yet.</div>'}</div></div></div>`;}
  function apiPage(){const api=state.data.api||{base_path:'/v1',models_endpoint:'/v1/models'},model=state.data.server.default_model||'your-model';return `<div class="page-head"><div><div class="eyebrow">Developer experience</div><h1>API & tools</h1><p>Connect SDKs, copy sample requests, and test any locally hosted modality.</p></div><button class="btn" data-action="copy-endpoint">▣ Copy base URL</button></div><div class="grid columns"><div class="card"><div class="card-head"><h2>OpenAI-compatible API</h2><span class="tag good">HTTP + SSE</span></div><div class="card-body"><p class="small-text">Set your SDK's base URL to this Cortex origin. Send a configured public model ID.</p><div class="code" id="curl-example">curl ${location.origin}${api.base_path}/chat/completions \\

      'image-classification':['Vision'],'object-detection':['Vision'],
      'visual-question-answering':['Vision'],'document-question-answering':['OCR'],

  async function loadCookbook(append=false){

      const existing=append?state.cookbookModels||[]:[];

        }catch(fallbackError){if(requestId!==state.cookbookRequestId)return;state.cookbookModels=[];state.cookbookSource='Curated offline catalog unavailable';state.cookbookError+=` ${fallbackError.message||''}`;}
      }else state.cookbookError=error.message||'Could not load model metadata.';
    }finally{
      if(requestId===state.cookbookRequestId){state.cookbookLoading=false;state.cookbookAbort=null;renderCookbook();}
    }
  }

  async function refresh(showToast=true){try{const data=await api('/admin/api/state');state.data=data;state.error='';state.errorStatus=0;state.errorCode='';state.connectionStatus='online';const defaultModel=data.models.find(x=>x.id===data.server.default_model);const defaultRuntime=defaultModel?data.runtime.models[defaultModel.id]?.status:null;const healthy=!defaultRuntime||defaultRuntime==='running';$('#health-pill').innerHTML=`<i class="dot ${healthy?'':'off'}"></i>${healthy?'Online':'Model not ready'} · ${data.models.length} models`;}catch(e){clearTimeout(runtimeRefreshTimer);state.data=null;state.error=e.message;state.errorStatus=Number(e.status)||0;state.errorCode=e.code||'';state.connectionStatus=state.errorStatus===401?'auth-required':state.errorStatus?'server-error':'offline';const label=state.connectionStatus==='auth-required'?'Sign-in required':state.connectionStatus==='offline'?'Server offline':state.errorCode==='admin_auth_not_configured'?'Auth not configured':state.errorStatus===503?'Server unavailable':`Server error · ${state.errorStatus}`;$('#health-pill').innerHTML=`<i class="dot off"></i>${label}`;}if(state.data){if(state.page==='chat'&&state.chatModel&&!state.data.models.some(x=>x.id===state.chatModel))state.chatModel=state.data.server.default_model||state.data.models[0]?.id||'';render();scheduleRuntimeRefresh();if(showToast)toast('Dashboard refreshed.');}else{render();}}
  async function showShortcuts(){toast('Shortcuts: Alt+1 Overview · 2 Models · 3 Chat · 4 Settings · 5 Activity · 6 API · 7 Cookbook · 8 Docs');}
  $('#nav').onclick=e=>{const button=e.target.closest('[data-page]');if(button)navigate(button.dataset.page);};$('#menu-btn').onclick=()=>setSidebarOpen(!$('#sidebar').classList.contains('open'));$('#theme-btn').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');$('#refresh-btn').onclick=()=>refresh();$('#auth-btn').onclick=()=>{if(!state.data){if(state.connectionStatus==='auth-required')loginModal();else bootstrap();return;}if(state.data.server.api_auth_enabled){logout();return;}navigate('settings');};
  $('#content').addEventListener('click',e=>{const link=e.target.closest('[data-page-link]');if(link)navigate(link.dataset.pageLink);});
  window.addEventListener('keydown',event=>{
    const hasModal=!!$('#modal-root .modal-backdrop');
    if(event.key==='Escape'){
      if(hasModal){event.preventDefault();closeModal();}
      else setSidebarOpen(false);
      return;
    }
    if(hasModal){keepModalFocus(event);return;}
    const target=event.target,editing=target instanceof HTMLElement&&(target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(target.tagName));
    if(!editing&&!event.isComposing&&event.altKey&&['1','2','3','4','5','6','7','8'].includes(event.key)){
      event.preventDefault();
      navigate(['overview','models','chat','settings','activity','api','cookbook','docs'][Number(event.key)-1]);
    }
  });
  bootstrap();
})();
</script>
</body>
