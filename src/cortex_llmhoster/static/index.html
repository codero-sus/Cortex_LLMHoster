dius:9px;padding:12px;font-size:10px;line-height:1.6;white-space:pre-wrap;overflow:auto}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:30;backdrop-filter:blur(5px)}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 25px 90px #0008;animation:rise .18s ease-out}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:14px;margin:0}.modal-body{padding:20px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:40;display:grid;gap:8px}.toast{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:11px;padding:11px 14px;min-width:220px;font-size:11px;animation:rise .2s ease}.toast.error{border-color:var(--danger)}.toast.success{border-color:var(--good)}.mobile-menu{display:none}.spinner{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin .8s linear infinite}.login-wrap{max-width:450px;margin:9vh auto}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.space{justify-content:space-between}.small-text{font-size:10px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:15px 0}.kbd{font:10px ui-monospace,monospace;border:1px solid var(--line);padding:3px 6px;border-radius:5px;color:var(--muted)}.reveal{animation:rise .22s ease-out}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">C</div><div><div class="brand-name">CORTEX</div><div class="brand-sub">LLM Control Room</div></div></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="overview"><span class="nav-icon">◈</span>Overview</button>
      <button data-page="models"><span class="nav-icon">⬡</span>Models <span class="tag" id="model-count">0</span></button>
      <button data-page="chat"><span class="nav-icon">◌</span>Chat playground</button>
      <button data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      <button data-page="activity"><span class="nav-icon">⌁</span>Activity</button>
      <button data-page="api"><span class="nav-icon">⌘</span>API & tools</button>
    </nav>
    <div class="side-bottom">
      <div class="side-card"><strong>Free local inference</strong><p>No Ollama or cloud provider key. Run models on your own CPU or compatible GPU.</p></div>
      <div class="side-version" id="version">Cortex · loading</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="row"><button class="icon-btn mobile-menu" id="menu-btn" aria-label="Open menu">☰</button><div><div class="crumb-title" id="page-title">Overview</div><div class="crumb-sub" id="page-subtitle">Your inference fleet at a glance</div></div></div>
      <div class="top-actions"><span class="status-pill" id="health-pill"><i class="dot off"></i>Connecting</span><button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">☼</button><button class="btn small soft" id="auth-btn">API key</button><button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">↻</button></div>
    </header>
    <section class="content" id="content" aria-live="polite"></section>
  </main>
</div>
<div id="modal-root"></div><div class="toast-wrap" id="toasts" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const $ = (q, root=document) => root.querySelector(q);
  const $$ = (q, root=document) => [...root.querySelectorAll(q)];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state = {page:'overview',data:null,chat:[],chatModel:'',abort:null,availableUpdate:null,workbenchObjectURL:null,startedAt:Date.now(),theme:localStorage.getItem('cortex-theme')||'dark'};
  const titles = {overview:['Overview','Your local inference runtime at a glance'],models:['Models','Configure local runtimes, weights, and task capabilities'],chat:['Chat playground','Stream responses from your hosted models'],settings:['Settings','Tune local hosting, API access, and saved configuration'],activity:['Activity','Inspect local inference requests, latency, and response codes'],api:['API & tools','Connect clients to your hosted models']};
  document.documentElement.dataset.theme=state.theme;
  const apiKey = () => localStorage.getItem('cortex-api-key') || '';
  function toast(message,type='success') { const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;$('#toasts').append(el);setTimeout(()=>el.remove(),3600); }
  async function api(path, options={}) {
    const headers = new Headers(options.headers || {}); const key=apiKey(); if(key) headers.set('Authorization',`Bearer ${key}`);
    if(options.body && typeof options.body!=='string' && !(options.body instanceof FormData)){headers.set('Content-Type','application/json');options.body=JSON.stringify(options.body);}
    const response=await fetch(path,{...options,headers});
    const type=response.headers.get('content-type')||'';let data=type.includes('json')?await response.json():await response.text();
    if(response.status===401){loginModal();throw new Error('Authorization required. Enter your CORTEX_API_KEY.');}
    if(!response.ok){const error=new Error(data?.error?.message||data?.detail||data||`Request failed (${response.status})`);error.code=data?.error?.code;error.status=response.status;throw error;}
    return data;
  }
  function setTheme(theme){state.theme=theme;document.documentElement.dataset.theme=theme;localStorage.setItem('cortex-theme',theme);}
  function loginModal(message='Enter the Cortex bearer key to unlock local model management.') {
    $('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Connect to Cortex</h2><button class="icon-btn" data-close>×</button></div><form id="login-form" class="modal-body"><p class="small-text">${esc(message)} This is a local bearer secret, not a cloud provider key. It is stored only in this browser's local storage.</p><div class="field"><label for="login-key">Local CORTEX_API_KEY</label><input id="login-key" class="input" type="password" autocomplete="current-password" required placeholder="Local bearer secret"></div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Connect</button></div></form></div></div>`;
    $('#login-key').focus();$('#login-form').onsubmit=async e=>{e.preventDefault();localStorage.setItem('cortex-api-key',$('#login-key').value.trim());$('#modal-root').innerHTML='';await refresh();};$$('[data-close]').forEach(x=>x.onclick=()=>$('#modal-root').innerHTML='');
  }
  function modelIdOptions(selected='') { const models=state.data?.models||[];return models.map(m=>`<option value="${esc(m.id)}" ${m.id===selected?'selected':''}>${esc(m.id)}${m.default?' · default':''}</option>`).join(''); }
  function requireState(){return state.data?.server ? null : `<div class="info-banner warning"><strong>Admin connection needed.</strong> ${state.error?esc(state.error):'Set a local CORTEX_API_KEY for this Cortex server, then enter it with the key button above. It is not a cloud credential; admin APIs stay disabled without it.'}</div>`;}
  function render(){
    const content=$('#content');const [title,subtitle]=titles[state.page];$('#page-title').textContent=title;$('#page-subtitle').textContent=subtitle;
    $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
    $('#model-count').textContent=state.data?.models?.length??'0';$('#version').textContent=`Cortex · ${state.data?.version||'Local LLM hoster'}`;
    const gate=requireState();if(gate){content.innerHTML=`<div class="page-head"><div><div class="eyebrow">Secure setup</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div></div>${gate}<div class="card card-body"><h2 style="font-size:14px">Quick start</h2><p class="small-text">Set the same secret in the Cortex process, then authenticate this browser.</p><div class="code">export CORTEX_API_KEY='a-long-random-secret'\npython -m cortex_llmhoster\n# Reload the page, then use the API key button.</div></div>`;return;}

  function modelsPage(){const models=state.data.models||[],runtimeModels=state.data.runtime?.models||{};return `<div class="page-head"><div><div class="eyebrow">Local inference</div><h1>Hosted models</h1><p>Choose a local runtime per model. Declare the tasks each model supports; only the default model starts automatically.</p></div><button class="btn primary" data-action="add-model">＋ Add local model</button></div>${models.length?`<div class="grid model-grid">${models.map(m=>{const runtime=runtimeModels[m.id]||{status:'stopped'},status=runtime.status||'stopped',llama=m.runtime==='llama.cpp';return `<article class="card model-card"><div class="model-card-top"><div class="model-avatar">${esc((m.id||'M').slice(0,1).toUpperCase())}</div><div class="model-main"><div class="model-name">${esc(m.id)} ${m.default?'<span class="tag accent">DEFAULT</span>':''}</div><div class="model-url">${esc(m.model_path||'Model path supplied by runtime')}</div></div><div class="model-card-actions"><button class="icon-btn" title="Edit model settings" data-action="edit-model" data-id="${esc(m.id)}">✎</button><button class="icon-btn" title="Remove model" data-action="delete-model" data-id="${esc(m.id)}">×</button></div></div><div class="model-meta"><div><div class="meta-label">Runtime</div><div class="meta-value">${esc(m.runtime)}${llama?' · GGUF':''}</div></div><div><div class="meta-label">Device mode</div><div class="meta-value">${llama?(m.gpu_layers===0?'CPU only':m.gpu_layers===-1?'Maximum GPU offload':`${m.gpu_layers} GPU layers`):'Configured by local runtime'}</div></div>${llama?`<div><div class="meta-label">Optimization</div><div class="meta-value">${m.optimization_level===1?'ULTRA (+1)':m.optimization_level===-1?'Efficient (-1)':'Balanced (0)'}</div></div><div><div class="meta-label">Context / parallel</div><div class="meta-value">${fmt(m.context_size)} tokens · ${m.parallel} slot(s)</div></div><div><div class="meta-label">Threads</div><div class="meta-value">${(m.threads||state.data.r   function activityPage(){const m=state.data.metrics,codes=Object.entries(m.status_codes||{}).sort((a,b)=>a[0].localeCompare(b[0]));const max=Math.max(1,...codes.map(x=>x[1]));const byModel=Object.entries(m.requests_by_model||{}).sort((a,b)=>b[1]-a[1]);return `<div class="page-head"><div><div class="eyebrow">Serving telemetry</div><h1>Activity</h1><p>Lightweight counters are local to this worker and reset when it restarts.</p></div><div class="row"><button class="btn" data-action="refresh">↻ Refresh</button><button class="btn danger" data-action="reset-metrics">Reset counters</button></div></div><div class="grid stats"><div class="card stat-card"><div class="stat-label">Completed</div><div class="stat-value">${fmt(m.completed_requests)}</div><div class="stat-foot">Total requests: ${fmt(m.total_requests)}</div></div><div class="card stat-card"><div class="stat-label">In flight</div><div class="stat-value">${fmt(m.in_flight)}</div><div class="stat-foot">Active local inference requests</div></div><div class="card stat-card"><div class="stat-label">Avg response duration</div><div class="stat-value">${Number(m.average_latency_ms||0).toFixed(1)}<span class="small-text"> ms</span></div><div class="stat-foot">Measured through response stream</div></div><div class="card stat-card"><div class="stat-label">Inference errors</div><div class="stat-value">${fmt(m.failed_requests)}</div><div class="stat-foot">Model server and API failures</div></div></div><div class="grid activity-grid"><div class="card"><div class="card-head"><h2>Responses by status code</h2></div><div class="card-body">${codes.length?codes.map(([code,n])=>`<div class="bar-row"><span>${esc(code)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,n/max*100)}%"></div></div><span>${fmt(n)}</span></div>`).join(''):'<div class="empty">No completed requests yet.</div>'}</div></div><div class="card"><div class="card-head"><h2>Requests by model</h2></div><div class="card-body">${byModel.length?b   function download(name,body,type){const blob=new Blob([body],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
  async function runLocalRequest(){const status=$('#workbench-status'),output=$('#workbench-output');if(!status||!output)return;status.textContent='Sending…';output.replaceChildren();if(state.workbenchObjectURL){URL.revokeObjectURL(state.workbenchObjectURL);state.workbenchObjectURL=null;}try{const base=(state.data.api?.base_path||'/v1').replace(/\/$/,'');let entered=$('#workbench-path').value.trim();if(!entered.startsWith('/'))entered='/'+entered;if(!entered.startsWith(base+'/')&&entered!==base)entered=`${base}${entered}`;const target=new URL(entered,location.origin);if(target.origin!==location.origin||!target.pathname.startsWith(base+'/')||target.pathname.split('/').some(part=>part==='..'))throw new Error('Use a same-origin endpoint under the configured API base path.');const method=$('#workbench-method').value,model=$('#workbench-model').value,file=$('#workbench-file').files?.[0],headers={},options={method,headers};if(apiKey())headers.Authorization=`Bearer ${apiKey()}`;if(method==='GET'&&model&&!target.searchParams.has('model'))target.searchParams.set('model',model);if(file){if(method!=='POST')throw new Error('Media uploads require POST.');const form=new FormData();form.append('model',model);form.append($('#workbench-file-field').value.trim()||'file',file,file.name);options.body=form;}else if(method!=='GET'){let payload;try{payload=JSON.parse($('#workbench-body').value||'{}');}catch{throw new Error('JSON body is not valid.');}if(payload&&typeof payload==='object'&&!Array.isArray(payload)){payload.model=model;options.body=JSON.stringify(payload);headers['Content-Type']='application/json';}else throw new Error('JSON body must be an object.');}const response=await fetch(target,options),type=response.headers.get('content-type')||'';status.textContent=`${response.status} ${response.statusText}`;if(!response.ok){const errorText=await response.text();output.textContent=errorText.slice(0,20000);return;}if(type.startsWith('image/')||type.startsWith('audio/')||type.startsWith('video/')){const blob=await response.blob();state.workbenchObjectURL=URL.createObjectURL(blob);const media=document.createElement(type.startsWith('image/')?'img':type.startsWith('audio/')?'audio':'video');media.src=state.workbenchObjectURL;if(media.tagName!=='IMG'){media.controls=true;media.style.width='100%';}else media.style.maxWidth='100%';output.append(media);const link=document.createElement('a');link.href=state.workbenchObjectURL;link.download=`cortex-result.${type.split('/')[1]?.split(';')[0]||'bin'}`;link.textContent='Download result';link.style.display='block';link.style.marginTop='10px';output.append(link);}else if(type.includes('json')){const result=await response.json();output.textContent=JSON.stringify(result,null,2);}else{output.textContent=(await response.text()).slice(0,20000);}}catch(e){status.textContent='Request failed';output.textContent=e.message;}}
  function initChat(){const select=$('#chat-model');if(!select)return;if(!select.value&&state.data.models.length)select.value=state.data.server.default_model||state.data.models[0].id;state.chatModel=select.value;loadChat(state.chatModel);select.onchange=()=>{saveChat(state.chatModel);state.chatModel=select.value;loadChat(state.chatModel);};const composer=$('#composer');composer.oninput=()=>{$('#prompt-hint').textContent=`${composer.value.length} chars · ~${Math.ceil(composer.value.trim().split(/\s+/).filter(Boolean).length*1.3)} input tokens`;};composer.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}};$('#temperature').oninput=e=>$('#temp-value').textContent=Number(e.target.value).toFixed(1);$('#top-p').oninput=e=>$('#top-p-value').textContent=Number(e.target.value).toFixed(2);$('#system-prompt').oninput=e=>localStorage.setItem('cortex-system-prompt',e.target.value);renderMessages();}
  function chatStorageKey(id){return `cortex-chat:${id||'default'}`;}function loadChat(id){try{state.chat=JSON.parse(localStorage.getItem(chatStorageKey(id))||'[]');}catch{state.chat=[];}renderMessages();}function saveChat(id){try{localStorage.setItem(chatStorageKey(id),JSON.stringify(state.chat.slice(-100)));}catch{toast('Browser storage is full; export the conversation.','error');}}
  function renderMessages(){const root=$('#chat-messages');if(!root)return;root.innerHTML='';if(!state.chat.length){root.innerHTML=`<div class="chat-welcome"><div class="welcome-icon">✦</div><h2>What are we building?</h2><p>Your prompts are sent to the selected local model through Cortex. Conversations are stored in this browser only.</p><div class="suggestions"><button class="btn small" data-prompt="Explain how attention works in transformers, with a tiny example.">Explain a concept</button><button class="btn small" data-prompt="Write a fast, well-tested Python function that…">Write code</button><button class="btn small" data-prompt="Summarize the key ideas in this text: ">Summarize text</button></div></div>`;$$('[data-prompt]',root).forEach(b=>b.onclick=()=>{$('#composer').value=b.dataset.prompt;$('#composer').focus();});return;}
    for(const [index,msg] of state.chat.entries()){const item=document.createElement('article');item.className=`message ${msg.role==='user'?'user':'assistant'}`;const avatar=document.createElement('div');avatar.className='message-avatar';avatar.textContent=msg.role==='user'?'Y':'C';const body=document.createElement('div');body.className='message-body';const label=document.createElement('div');label.className='message-label';label.textContent=msg.role==='user'?'You':'Cortex';const text=document.createElement('div');text.className='message-text';text.textContent=msg.content||'';body.append(label,text);if(msg.role==='assistant'){const tools=document.createElement('div');tools.className='message-tools';const copy=document.createElement('button');copy.textContent='Copy';copy.onclick=()=>navigator.clipboard.writeText(msg.content||'').then(()=>toast('Message copied.'));tools.append(copy);body.append(tools);}item.append(avatar,body);root.append(item);}
    root.scrollTop=root.scrollHeight;
  }
  function updateLiveAssistant(){const root=$('#chat-messages');if(!root)return;const nodes=root.querySelectorAll('.message.assistant .message-text');const last=nodes[nodes.length-1];if(last)last.textContent=state.chat[state.chat.length-1]?.content||'';root.scrollTop=root.scrollHeight;}
  async function sendChat(){const input=$('#composer');const text=input?.value.trim();if(!text||state.abort)return;const model=$('#chat-model').value;if(!model)return toast('Choose a model first.','error');state.chat.push({role:'user',content:text});input.value='';input.style.height='';renderMessages();saveChat(model);const assistant={role:'assistant',content:''};state.chat.push(assistant);const start=performance.now();const controller=new AbortController();state.abort=controller;$('#chat-state').textContent='Generating…';$('#send-chat').disabled=true;$('#cancel-chat').hidden=false;const params={model,messages:[{role:'system',content:$('#system-prompt').value.trim()},...state.chat.filter(x=>x.role!=='system'&&(x.role!=='assistant'||x.content)).slice(-40).map(({role,content})=>({role,content}))].filter(m=>m.content!==''),temperature:Number($('#temperature').value),top_p:Number($('#top-p').value),max_tokens:Number($('#max-tokens').value),frequency_penalty:Number($('#frequency-penalty').value),presence_penalty:Number($('#presence-penalty').value),stream:$('#stream-toggle').checked};const stop=$('#stop-sequence').value.trim();if(stop)params.stop=[stop];
    try{const headers={'Content-Type':'application/json'};if(apiKey())headers.Authorization=`Bearer ${apiKey()}`;const response=await fetch(`${state.data.api?.base_path||'/v1'}/chat/completions`,{method:'POST',headers,body:JSON.stringify(params),signal:controller.signal});if(!response.ok){let err;try{err=await response.json();}catch{err={};}if(response.status===401)loginModal();throw new Error(err.error?.message||`Inference request failed (${response.status})`);}if(params.stream&&response.body){await readSSE(response.body,assistant); }else{const result=await response.json();assistant.content=extractText(result.choices?.[0]?.message?.content)||JSON.stringify(result);renderMessages();}}
    catch(e){if(e.name==='AbortError'){toast('Generation stopped.','success');}else{assistant.content=assistant.content||`Request error: ${e.message}`;toast(e.message,'error');}}
    finally{state.abort=null;$('#send-chat').disabled=false;$('#cancel-chat').hidden=true;$('#chat-state').textContent=`${((performance.now()-start)/1000).toFixed(1)}s`;renderMessages();saveChat(model);}
  }
  function extractText(content){if(typeof content==='string')return content;if(Array.isArray(content))return content.map(x=>typeof x==='string'?x:(x.text||x.content||'')).join('');return '';}
  async function readSSE(stream,assistant){const reader=stream.getReader();const decoder=new TextDecoder();let buffer='';let done=false;while(!done){const {value,done:ended}=await reader.read();done=ended;buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let boundary;while((boundary=buffer.search(/\r?\n\r?\n/))>=0){const frame=buffer.slice(0,boundary);const match=buffer.slice(boundary).match(/^\r?\n\r?\n/);buffer=buffer.slice(boundary+(match?.[0].length||2));const data=frame.split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim()).join('\n');if(!data||data==='[DONE]')continue;try{const packet=JSON.parse(data);for(const choice of packet.choices||[]){const delta=choice.delta||{};assistant.content+=extractText(delta.content);if(delta.refusal)assistant.content+=delta.refusal;}updateLiveAssistant();}catch{}}} }
  function clearChat(){if(!state.chat.length)return; if(!confirm('Clear this browser conversation?'))return;localStorage.removeItem(chatStorageKey(state.chatModel));state.chat=[];renderMessages();toast('Conversation cleared.');}
  function exportChat(){const payload={model:state.chatModel,exported_at:new Date().toISOString(),messages:state.chat};download(`cortex-chat-${Date.now()}.json`,JSON.stringify(payload,null,2),'application/json');toast('Conversation exported.');}
  let runtimeRefreshTimer=null;
  function scheduleRuntimeRefresh(){clearTimeout(runtimeRefreshTimer);const busy=Object.values(state.data?.runtime?.models||{}).some(x=>x.status==='starting'||x.status==='stopping');if(busy)runtimeRefreshTimer=setTimeout(()=>refresh(false),1500);}
  async function refresh(showToast=true){try{const data=await api('/admin/api/state');state.data=data;state.error='';const defaultModel=data.models.find(x=>x.id===data.server.default_model);const defaultRuntime=defaultModel?data.runtime.models[defaultModel.id]?.status:null;const healthy=!defaultRuntime||defaultRuntime==='running';$('#health-pill').innerHTML=`<i class="dot ${healthy?'':'off'}"></i>${healthy?'Online':'Model not ready'} · ${data.models.length} models`;if(state.page==='chat'&&state.chatModel&&!data.models.some(x=>x.id===state.chatModel))state.chatModel=data.server.default_model||data.models[0]?.id||'';render();scheduleRuntimeRefresh();if(showToast)toast('Dashboard refreshed.');}catch(e){clearTimeout(runtimeRefreshTimer);state.data=null;state.error=e.message;$('#health-pill').innerHTML='<i class="dot off"></i>Auth required';render();}}
  async function showShortcuts(){toast('Shortcuts: 1 Overview · 2 Models · 3 Chat · 4 Settings · 5 Activity');}
  $('#nav').onclick=e=>{const button=e.target.closest('[data-page]');if(button)navigate(button.dataset.page);};$('#menu-btn').onclick=()=>$('#sidebar').classList.toggle('open');$('#theme-btn').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');$('#refresh-btn').onclick=()=>refresh();$('#auth-btn').onclick=()=>loginModal('Enter the API key configured as CORTEX_API_KEY.');
  $('#content').addEventListener('click',e=>{const link=e.target.closest('[data-page-link]');if(link)navigate(link.dataset.pageLink);});window.addEventListener('keydown',e=>{if(e.altKey&&['1','2','3','4','5','6'].includes(e.key)){e.preventDefault();navigate(['overview','models','chat','settings','activity','api'][Number(e.key)-1]);}if(e.key==='Escape')$('#sidebar').classList.remove('open');});
  refresh(false);
})();
</script>
