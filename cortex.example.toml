# Local model hosting with llama.cpp or a per-model local command runtime.
# Copy to cortex.toml and update local weight/runtime paths.
# Install runtime dependencies separately; no model weights are auto-downloaded.

[server]
host = "127.0.0.1"
port = 8624
workers = 1
log_level = "warning"
access_log = false
api_key_env = "CORTEX_API_KEY"
default_model = "qwen-local"
# Optional absolute path to llama-server; defaults to PATH lookup.
# llama_server_path = "/usr/local/bin/llama-server"
max_connections = 512
max_keepalive_connections = 128
keepalive_expiry = 30.0
connect_timeout = 5.0
read_timeout = 300.0
write_timeout = 60.0
pool_timeout = 5.0
max_json_body_bytes = 16777216
# Audio/image/video uploads are spooled to temporary storage and capped here.
max_media_body_bytes = 2147483648
max_inference_requests = 8

[[models]]
id = "qwen-local"
runtime = "llama.cpp"
capabilities = ["text_generation"]
# -1 = Efficient, 0 = Balanced, 1 = ULTRA; validate memory before using 1.
optimization_level = 0
model_path = "/models/qwen-instruct-q4_k_m.gguf"
default = true

# CPU-only: gpu_layers = 0. For a compatible GPU build, use -1 for maximum
# offload or a positive number for selected layers.
gpu_layers = 0
# Zero chooses an automatic thread count that leaves CPU capacity for the OS.
threads = 0
threads_batch = 0

# Reduce these values first if the machine is short on RAM or VRAM.
context_size = 2048
batch_size = 256
ubatch_size = 64
parallel = 1
cache_type_k = "q8_0"
cache_type_v = "q8_0"
flash_attn = "auto"
use_mmap = true
mlock = false
embedding = false
# Optional multimodal projector for a compatible multimodal GGUF.
# mmproj_path = "/models/mmproj-model-f16.gguf"

# Generic local process adapter for other model families/tasks. The command
# must start a local OpenAI-compatible HTTP server and bind to {host}/{port}.
# It can expose chat/vision/OCR/audio/video endpoints supported by that engine.
# [[models]]
# id = "multimodal-local"
# runtime = "command"
# model_path = "/models/my-multimodal-model"
# api_base_path = "/v1"
# health_path = "/health"
# capabilities = ["text_generation", "vision_understanding", "ocr", "audio_transcription", "audio_generation", "video_understanding", "video_generation", "image_generation"]
# runtime_command = ["python", "serve_local_model.py", "--model", "{model_path}", "--host", "{host}", "--port", "{port}"]
# default = false

# Additional local models may be listed here. Only the default model is
# started automatically; other models can be started from the dashboard.
